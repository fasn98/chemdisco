name: CI

# Two deliberately separate concerns.
#
# `core` runs without RDKit, which proves the claim the architecture rests on:
# the curation, unit-conversion, splitting and evaluation logic is independent of
# any chemistry toolkit. If someone moves an RDKit import into one of those
# modules, this job fails even though the full suite would still pass.
#
# `chem` installs RDKit and runs everything, including the structure handling and
# fragment generation.
#
# Live-network validation against ChEMBL is NOT here. It belongs in
# `validate.yml`, triggered on demand: a public API being slow must not turn into
# a red mark on a pull request that did not touch data retrieval.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core logic (no RDKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install without the chemistry extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Confirm RDKit really is absent
        # Otherwise this job silently becomes a duplicate of the `chem` job and
        # stops testing the separation it exists to test.
        run: |
          python - <<'PY'
          import importlib.util, sys
          if importlib.util.find_spec("rdkit") is not None:
              sys.exit("RDKit is installed in the core job; the toolkit-free "
                       "guarantee is no longer being tested here")
          print("RDKit absent, as intended")
          PY

      - name: Run the toolkit-free test modules
        run: |
          pytest -v \
            tests/test_provenance.py \
            tests/test_units.py \
            tests/test_curate.py \
            tests/test_split.py \
            tests/test_qsar.py \
            tests/test_chembl.py \
            tests/test_no_fabrication.py

  chem:
    name: Full suite (with RDKit)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install with RDKit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[chem,dev]"

      - name: Report the RDKit version under test
        run: python -c "import rdkit; print('RDKit', rdkit.__version__)"

      - name: Confirm the SA_Score contrib module is reachable
        # SAscore lives outside the RDKit package namespace and its availability
        # varies by install method. Knowing it is absent is better than silently
        # reporting synthetic accessibility as unavailable for a whole run.
        continue-on-error: true
        run: |
          python - <<'PY'
          from chemdisco.chem.alerts import synthetic_accessibility
          q = synthetic_accessibility("CC(=O)Oc1ccccc1C(=O)O")
          print("SAscore for aspirin:", q.label())
          PY

      - name: Run the full suite
        id: suite
        run: |
          set -o pipefail
          pytest -v --cov=chemdisco --cov-report=term-missing 2>&1 | tee pytest.log

      - name: Annotate test failures
        if: failure() && steps.suite.outcome == 'failure'
        # Raw job logs are not retrievable from every environment, so a failing
        # test was reported only as "exit code 1". Annotations carry the actual
        # failure, which is the whole point of running the suite.
        run: |
          payload=$(grep -A 25 -E "^(FAILED|ERROR|=+ FAILURES)" pytest.log \
            | head -n 200 | sed 's/%/%25/g' | sed 's/\r//' \
            | awk '{printf "%s%%0A", $0}')
          if [ -z "$payload" ]; then
            payload=$(tail -n 60 pytest.log | sed 's/%/%25/g' \
              | awk '{printf "%s%%0A", $0}')
          fi
          echo "::error title=Test failures py${{ matrix.python-version }}::${payload}"

      - name: Assert nothing was skipped for want of RDKit
        # The guard's purpose: RDKit is installed in this job, so no test may
        # skip because RDKit is missing -- that would mean the suite passes while
        # testing nothing.
        #
        # It checks skip *reasons* rather than the skip count, because some skips
        # are deliberate and correct here: the docking tests need Vina, which
        # this job does not install, and the network-dependent checks are gated
        # behind CHEMDISCO_NETWORK_TESTS. Those run in the docking workflow.
        run: |
          pytest -q -rs 2>&1 | tee result.txt
          if grep -qi "RDKit is not installed" result.txt; then
            echo "::error::a test skipped for want of RDKit in the job that installs it"
            grep -i "RDKit is not installed" result.txt
            exit 1
          fi
          echo "Skips in this job (all expected to be Vina or network gates):"
          grep -E "^SKIPPED" result.txt || echo "  none"

  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[chem,dev]"

      - name: Ruff
        # `--output-format github` emits GitHub annotations, which attach to the
        # check run and are readable through the API. Raw job logs are not
        # always retrievable (artifact endpoints can be blocked by network
        # policy), so annotations are the reliable way to see what failed.
        run: ruff check chemdisco tests scripts --output-format github

      - name: Ruff summary
        # Runs even on failure so the findings also land in the job summary,
        # which is where a human will look first.
        if: always()
        run: |
          {
            echo '## Ruff findings'
            echo '```'
            ruff check chemdisco tests scripts --output-format concise || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Mypy
        # Not blocking yet: the codebase is young and RDKit has no stubs.
        continue-on-error: true
        run: mypy chemdisco
