name: Validate docking

# Redocking: take a crystal structure's own ligand out, dock it back, measure how
# far the predicted pose lands from the observed one. The one check that
# establishes a docking setup is correct, because it tests the receptor
# preparation, the search box and the ligand handling together.
#
# Separate from CI because it needs the network and takes minutes. A failing
# redock does fail this job: it means the docking setup in this repository does
# not reproduce reality.

on:
  workflow_dispatch:
    inputs:
      pdb:
        description: "PDB id to redock"
        required: false
        default: "2QMG"
      survey:
        description: "Comma-separated PDB ids to inspect instead of docking"
        required: false
        default: ""
      mode:
        description: "redock (default) or enrichment"
        required: false
        default: "redock"
      exhaustiveness:
        description: "Vina search effort"
        required: false
        default: "16"
  schedule:
    - cron: "41 5 * * 1"

jobs:
  redock:
    if: inputs.mode != 'enrichment'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install OpenBabel
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openbabel

      - name: Install the docking toolchain
        # scipy and gemmi are hard requirements of meeko that meeko does not
        # declare; successive probe runs found each in turn.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[chem,dev]"
          python -m pip install vina scipy gemmi meeko

      - name: Run the docking unit tests with network checks enabled
        env:
          CHEMDISCO_NETWORK_TESTS: "1"
        run: pytest -v tests/test_dock_pure.py tests/test_dock_engine.py

      - name: Redock
        id: redock
        run: |
          mkdir -p runs
          if [ -n "${{ inputs.survey }}" ]; then
            python scripts/validate_docking.py \
              --survey "${{ inputs.survey }}" 2>&1 | tee runs/redock.log
          elif [ "${{ inputs.mode }}" = "enrichment" ]; then
            python scripts/validate_enrichment.py \
              --pdb "${{ inputs.pdb || '4FRS' }}" \
              --exhaustiveness "${{ inputs.exhaustiveness || '8' }}" \
              --output runs/enrichment.json 2>&1 | tee runs/redock.log
          else
            python scripts/validate_docking.py \
              --pdb "${{ inputs.pdb || '2QMG' }}" \
              --exhaustiveness "${{ inputs.exhaustiveness || '16' }}" \
              --output runs/redock.json 2>&1 | tee runs/redock.log
          fi

      - name: Report
        if: always()
        run: |
          {
            echo '## Redocking validation'
            echo '```'
            cat runs/redock.log 2>/dev/null || echo '(no output)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Annotate
        if: always()
        # Two halves: a single annotation's message is truncated in transit well
        # before the documented limit, and job logs and artifact downloads are
        # unreachable from some environments.
        run: |
          if [ ! -f runs/redock.log ]; then
            echo "::error::the redocking step produced no output"
            exit 0
          fi
          level=error
          [ "${{ steps.redock.outcome }}" = "success" ] && level=notice
          total=$(wc -l < runs/redock.log)
          half=$(( (total + 1) / 2 ))
          encode() { sed 's/%/%25/g' | sed 's/\r//' | awk '{printf "%s%%0A", $0}'; }
          echo "::${level} title=Redock 1 of 2::$(head -n "$half" runs/redock.log | encode)"
          echo "::${level} title=Redock 2 of 2::$(tail -n +"$((half + 1))" runs/redock.log | encode)"

  enrichment:
    # Sharded because the power calculation from the first run asked for about
    # 68 compounds per group: hours of docking on one runner at roughly 100s per
    # ligand, minutes across several. Each shard docks a stride of the same
    # interleaved ligand list into the same receptor and box, so the scores pool
    # directly -- and the combine step checks that rather than assuming it.
    if: inputs.mode == 'enrichment'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install OpenBabel
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openbabel
      - name: Install the docking toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[chem,dev]"
          python -m pip install vina scipy gemmi meeko
      - name: Dock this shard
        run: |
          mkdir -p runs
          python scripts/validate_enrichment.py \
            --pdb "${{ inputs.pdb || '4FRS' }}" \
            --exhaustiveness "${{ inputs.exhaustiveness || '4' }}" \
            --n-actives 40 \
            --decoys-per-active 2 \
            --shard ${{ matrix.shard }} \
            --n-shards 6 \
            --time-budget 2700 \
            --output "runs/shard_${{ matrix.shard }}.json" 2>&1 \
            | tee "runs/shard_${{ matrix.shard }}.log"
      - uses: actions/upload-artifact@v4
        with:
          name: enrichment-shard-${{ matrix.shard }}
          path: runs/shard_${{ matrix.shard }}.*
          if-no-files-found: warn

  enrichment-combine:
    if: inputs.mode == 'enrichment'
    needs: enrichment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[chem,dev]"
      - uses: actions/download-artifact@v4
        with:
          path: shards
          pattern: enrichment-shard-*
          merge-multiple: true
      - name: Combine and analyse
        id: combine
        run: |
          mkdir -p runs
          python scripts/validate_enrichment.py \
            --combine shards \
            --output runs/enrichment.json 2>&1 | tee runs/enrichment.log
      - name: Annotate
        if: always()
        run: |
          if [ ! -f runs/enrichment.log ]; then
            echo "::error::the combine step produced no output"
            exit 0
          fi
          level=error
          [ "${{ steps.combine.outcome }}" = "success" ] && level=notice
          payload=$(sed 's/%/%25/g' runs/enrichment.log | sed 's/\r//' \
            | awk '{printf "%s%%0A", $0}')
          echo "::${level} title=Enrichment::${payload}"
