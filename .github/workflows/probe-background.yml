name: Probe background

# Measures whether a background drawn from unrelated targets lets the
# conserved-feature check discriminate. A diagnostic with two possible honest
# answers, so the job stays green either way -- a red mark would say the probe
# broke rather than that the background did not work.

on:
  workflow_dispatch:
    inputs:
      accession:
        description: "UniProt accession of the target"
        required: false
        default: "P56817"
      name:
        description: "Target name"
        required: false
        default: "BACE1"
      background_size:
        description: "Ceiling on the background set"
        required: false
        default: "1200"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install with RDKit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[chem,dev]"

      - name: Probe
        id: probe
        run: |
          set -o pipefail
          mkdir -p runs
          python scripts/probe_background.py \
            --accession "${{ inputs.accession || 'P56817' }}" \
            --name "${{ inputs.name || 'BACE1' }}" \
            --background-size "${{ inputs.background_size || '1200' }}" \
            2>&1 | tee runs/probe_background.log

      - name: Report
        if: always()
        run: |
          {
            echo '## Background probe'
            echo '```'
            cat runs/probe_background.log 2>/dev/null || echo '(no output)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Annotate
        if: always()
        # Job logs are not retrievable from every environment and artifact
        # downloads can be blocked, so the findings go out as annotations. Split
        # in two because a single annotation gets truncated at this length.
        run: |
          if [ ! -f runs/probe_background.log ]; then
            echo "::error::the probe produced no output"
            exit 0
          fi
          encode() { sed 's/%/%25/g' | sed 's/\r//' | awk '{printf "%s%%0A", $0}'; }
          total=$(wc -l < runs/probe_background.log)
          half=$(( (total + 1) / 2 ))
          echo "::error title=Background probe 1 of 2::$(head -n "$half" runs/probe_background.log | encode)"
          echo "::error title=Background probe 2 of 2::$(tail -n +"$((half + 1))" runs/probe_background.log | encode)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: background-probe
          path: runs/probe_background.log
          if-no-files-found: warn
