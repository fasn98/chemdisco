name: Live validation

# Separate from CI on purpose. This job talks to ChEMBL over the network, so it
# can fail for reasons that have nothing to do with a code change -- a slow public
# API must never put a red mark on a pull request that did not touch retrieval.
#
# It runs on demand and weekly. The weekly run is the useful part: it catches
# ChEMBL release changes that alter the curated dataset, which is exactly the kind
# of silent drift that makes an old reported metric unreproducible.

on:
  workflow_dispatch:
    inputs:
      accession:
        description: "UniProt accession to validate against"
        required: false
        default: "P56817"
      name:
        description: "Human-readable target name"
        required: false
        default: "BACE1"
  schedule:
    - cron: "17 4 * * 1"

jobs:
  validate:
    name: End-to-end validation against live ChEMBL
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[chem,dev]"

      - name: Restore the ChEMBL response cache
        uses: actions/cache@v4
        with:
          path: .cache/chembl
          key: chembl-${{ inputs.accession || 'P56817' }}-${{ github.run_id }}
          restore-keys: |
            chembl-${{ inputs.accession || 'P56817' }}-

      - name: Validate
        id: validate
        # Output is captured rather than only streamed, because raw Actions job
        # logs are not always retrievable (artifact and log endpoints can be
        # blocked by network policy). The capture is replayed below into the job
        # summary and, on failure, into annotations, both of which are readable
        # through the REST API.
        run: |
          set -o pipefail
          # tee cannot create the directory, and the script only creates it when
          # it reaches the --output write at the end -- so without this the
          # capture silently produced nothing on a failing run.
          mkdir -p runs
          python scripts/validate_target.py \
            --accession "${{ inputs.accession || 'P56817' }}" \
            --name "${{ inputs.name || 'BACE1' }}" \
            --output runs/validation.json 2>&1 | tee runs/validate.log

      - name: Report the validation output
        if: always()
        run: |
          mkdir -p runs
          {
            echo '## Validation output'
            echo '```'
            tail -c 60000 runs/validate.log 2>/dev/null || echo '(no output captured)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Annotate the output
        if: always()
        # Always, not only on failure: the metrics are the point of the run, and
        # raw job logs, job summaries and artifact downloads are all unreachable
        # from some environments. Annotations are the one channel the REST API
        # serves, and GitHub caps their number rather than their length -- hence
        # one annotation carrying the whole report, newlines encoded as %0A.
        run: |
          if [ -f runs/validate.log ]; then
            payload=$(tail -c 50000 runs/validate.log \
              | sed 's/%/%25/g' \
              | sed 's/\r//' \
              | awk '{printf "%s%%0A", $0}')
            if [ "${{ steps.validate.outcome }}" = "success" ]; then
              echo "::notice title=Validation output::${payload}"
            else
              echo "::error title=Validation output::${payload}"
            fi
          else
            echo "::error::the validation step produced no captured output"
          fi

      - name: Upload the summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-summary
          path: |
            runs/validation.json
            runs/validate.log
          if-no-files-found: warn
