[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chemdisco"
version = "0.1.0"
description = "An auditable computational drug-discovery pipeline: curated public bioactivity data, QSAR with honest validation, and fragment-based candidate generation."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Fabio" }]
readme = "README.md"
keywords = ["cheminformatics", "qsar", "drug-discovery", "chembl", "rdkit"]

# Deliberately minimal. The curation, unit-conversion, splitting and evaluation
# layers need only numpy and scikit-learn, so they install and run anywhere --
# including environments where RDKit is unavailable.
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.3",
    "requests>=2.31",
]

[project.optional-dependencies]
# RDKit is required for anything touching structures: standardisation,
# descriptors, fingerprints, scaffolds, alerts, generation.
chem = ["rdkit>=2023.9"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "mypy>=1.8"]

[project.scripts]
chemdisco = "chemdisco.cli:main"

[tool.setuptools.packages.find]
include = ["chemdisco*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Surface warnings rather than hiding them: a deprecated RDKit call that still
# works today is a failure waiting for the next release.
filterwarnings = ["default"]

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
# E501 is handled by the formatter; long explanatory docstrings are intentional.
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
# RDKit ships no type stubs.
[[tool.mypy.overrides]]
module = ["rdkit.*", "sklearn.*", "requests.*", "sascorer"]
ignore_missing_imports = true
